name: Public source connectivity check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'Webinfinity11/vakansiebi'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    steps:
      - name: Check official public endpoints
        shell: bash
        run: |
          for url in https://vacancy.hr.gov.ge/robots.txt https://vacancy.hr.gov.ge/ https://www.hr.gov.ge/; do
            echo "$url"
            curl -4 -I --connect-timeout 20 --max-time 30 "$url" || true
          done
