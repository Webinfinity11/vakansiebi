name: Vacancy scraper
on:
  schedule:
    # Every three hours from 07:17 to 22:17 Tbilisi time (UTC+4). Georgian boards post in the
    # daytime; the two night runs found almost nothing and only kept the database awake.
    - cron: '17 3-18/3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vacancy-scraper-production
  cancel-in-progress: false
jobs:
  # One query decides which sources are due. A source that is not due — a quiet board whose
  # next check was pushed out, or one an admin set to a longer interval — no longer starts a
  # runner, installs dependencies and connects only to find it has nothing to do; when nothing
  # is due, the run ends here and the database is not woken again.
  plan:
    if: github.repository == 'Webinfinity11/vakansiebi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      sources: ${{ steps.due.outputs.sources }}
    steps:
      - id: due
        env:
          DATABASE_URL: ${{ secrets.SCRAPER_DATABASE_URL }}
        run: |
          command -v psql >/dev/null || sudo apt-get install -y -q postgresql-client >/dev/null
          sources=$(psql "$DATABASE_URL" -Atc "SELECT coalesce(json_agg(id ORDER BY id), '[]')
            FROM sources WHERE id = ANY(ARRAY['hr','jobs','ss','gancxadebebi','myjobs','awork','dk'])
            AND enabled AND NOT retired
            AND (requested_at IS NOT NULL OR (auto_enabled AND next_run_at <= now() + interval '10 minutes'))")
          echo "Due: $sources"
          echo "sources=$sources" >> "$GITHUB_OUTPUT"
  scrape:
    needs: plan
    if: needs.plan.outputs.sources != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      # Limit simultaneous database pools while preserving timely source checks.
      max-parallel: 2
      # The two government hosts time out from every GitHub-hosted runner: vacancy.hr.gov.ge
      # (verified 2026-09-09) and worknet.moh.gov.ge (verified 2026-09-12, run 34701274010).
      # They are collected from a reachable network instead; see README. Keeping them here
      # would also push their next run a day out on every deferral, delaying that collection.
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Import, validate and publish due vacancies
        run: npm run worker -- --source=${{ matrix.source }} --due --once
        env:
          DATABASE_URL: ${{ secrets.SCRAPER_DATABASE_URL }}
          GOOGLE_INDEXING_CLIENT_EMAIL: ${{ secrets.GOOGLE_INDEXING_CLIENT_EMAIL }}
          GOOGLE_INDEXING_PRIVATE_KEY: ${{ secrets.GOOGLE_INDEXING_PRIVATE_KEY }}
          # Bound transfer and historical discovery on the database plan.
          # The first listing page still gets priority; robots.txt spacing is unchanged.
          SCRAPE_CRON_MINUTES: '180'
          CRAWL_BATCH_SIZE: '200'
          SCRAPE_BUDGET_MINUTES: '8'
          DETAIL_CONCURRENCY: '3'
          DISCOVERY_PAGE_BUDGET: '3'

