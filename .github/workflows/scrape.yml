name: Vacancy scraper
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vacancy-scraper-production
  cancel-in-progress: false
jobs:
  scrape:
    if: github.repository == 'Webinfinity11/vakansiebi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        source: [hr, jobs, ss, hrgov, gancxadebebi]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Import, validate and publish due vacancies
        run: npm run worker -- --source=${{ matrix.source }} --due --once
        env:
          DATABASE_URL: ${{ secrets.SCRAPER_DATABASE_URL }}
          CRAWL_BATCH_SIZE: '300'
          DISCOVERY_PAGE_BUDGET: '30'
          CRAWL_DELAY_MS: '2000'
      - name: Verify refreshed descriptions match published text
        if: always()
        run: npx tsx scripts/verify-description-refresh.ts --source=${{ matrix.source }}
        env:
          DATABASE_URL: ${{ secrets.SCRAPER_DATABASE_URL }}
